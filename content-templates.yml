# EXAMPLE PROJECT 1: B2B SaaS Feature
      - layout: top-middle
        title: Multi-Tenant Access Control System
        sub_title: Lead Product Manager | B2B SaaS
        caption: 2023 | 9 months
        description: |
          **Challenge:** Enterprise clients couldn't onboard teams without manual admin support, creating 3-5 day delays and support burden.

          **Approach:**
          - Researched 25 enterprise accounts to map permission patterns
          - Designed role-based access control (RBAC) with custom roles
          - Built self-service admin portal with bulk user management
          - Created migration plan for 150+ existing enterprise accounts

          **Outcome:**
          - Admin support tickets reduced 70%
          - Enterprise onboarding time: 5 days → 2 hours
          - Unlocked $400K in enterprise pipeline deals
          - 95% admin satisfaction score

# EXAMPLE PROJECT 2: Mobile Product
      - layout: top-middle
        title: Mobile-First Dashboard Redesign
        sub_title: Product Manager | Fintech
        caption: 2022 | 5 months
        link: https://example.com/case-study
        link_text: View Case Study
        description: |
          **Challenge:** 65% of users on mobile but product optimized for desktop, causing 40% task abandonment rate.

          **Approach:**
          - Analyzed 100K mobile sessions to identify friction points
          - Ran design sprint with UX team to prototype solutions
          - Launched progressive rollout to 10% of users first
          - Monitored task completion and performance metrics daily

          **Outcome:**
          - Mobile task completion: 60% → 92%
          - Page load time improved 3.2s → 1.1s
          - Mobile NPS increased 42 → 67
          - Featured in Product Hunt top 5

# EXAMPLE PROJECT 3: AI/ML Product
      - layout: top-middle
        title: Predictive Churn Model Integration
        sub_title: Product Manager | SaaS Analytics
        caption: 2021 | 7 months
        additional_links:
          - title: Technical Blog Post
            icon: fas fa-blog
            url: https://blog.example.com/churn-prediction
        description: |
          **Challenge:** Retention team reactively addressing churn, missing 60% of at-risk accounts until too late.

          **Approach:**
          - Partnered with data science to build churn prediction model
          - Designed early warning system integrated into CRM workflow
          - Created playbook for customer success interventions
          - Built feedback loop to improve model accuracy

          **Outcome:**
          - Churn prediction accuracy: 78% precision, 85% recall
          - Proactive intervention rate: 0% → 65% of at-risk accounts
          - Net revenue retention improved 8 percentage points
          - Model featured in vendor case study

